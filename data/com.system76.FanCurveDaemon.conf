<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the daemon) may own the service name -->
  <policy user="root">
    <allow own="com.system76.FanCurveDaemon"/>
  </policy>

  <!-- Any user may call methods on the daemon -->
  <policy context="default">
    <allow send_destination="com.system76.FanCurveDaemon"/>
    <allow receive_sender="com.system76.FanCurveDaemon"/>
  </policy>
</busconfig>
